<html lang="ja" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Google Symbols (Material Symbols) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    /* ===== Classroom本物のCSS変数 ===== */
    :root {
      --gm3-sys-color-primary: #0842a0;
      --gm3-sys-color-on-primary: #fff;
      --gm3-sys-color-primary-container: #d3e3fd;
      --gm3-sys-color-surface: #fff;
      --gm3-sys-color-surface-container-low: #f8fafd;
      --gm3-sys-color-surface-container: #f0f4f9;
      --gm3-sys-color-surface-variant: #e1e3e1;
      --gm3-sys-color-outline-variant: #c4c7c5;
      --gm3-sys-color-outline: #747775;
      --gm3-sys-color-on-surface: #1f1f1f;
      --gm3-sys-color-on-surface-variant: #444746;
      --gm3-sys-color-inverse-surface: #303030;
      --gm3-sys-color-secondary: #00639b;
      --gm3-sys-color-error: #b3261e;
      --gm3-sys-color-on-primary-fixed-variant: #0842a0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: Roboto, Arial, sans-serif;
      background-color: var(--gm3-sys-color-surface-container-low);
      color: var(--gm3-sys-color-on-surface);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 本物のClassroomクラス（classroomelement.htmlより移植）===== */

    /* ---- TOP NAV BAR ---- */
    .joJglb {

      border-bottom: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      flex-shrink: 0;
      line-height: 1.7em;
      position: fixed;
      top: 0;

      z-index: 986;
    }
    .gmNu1d { align-items: center; display: flex; flex-direction: row; }
    .FXKA9c { flex-grow: 1; min-width: 0; overflow: hidden; margin-right: 1rem; }
    .XIpEib { height: 4rem; padding-left: 1.5rem; }
    .k43Owe { flex-shrink: 0; margin-right: 1rem; }
    .Hwv4mb { display: flex; flex-direction: column; justify-content: center; max-width: 100%; overflow: hidden; }

    .y183Ub { font-family: Google Sans,Roboto,Arial,sans-serif; font-size: 1.5rem; font-weight: 400; letter-spacing: 0; line-height: 2rem; color: var(--gm3-sys-color-on-surface-variant, #444746); }
    .UAJaRc { height: 28px; }
    .dR850e { display: none; margin-left: 0; }
    .FkiMUb { margin-left: .625rem; }
    .PYWmSe { flex-shrink: 0; margin-right: calc(-36px + 1rem); margin-left: calc(-48px + .75rem); }
    .Oe4zIb { display: none; margin: 0; }

      box-sizing: border-box; cursor: pointer; display: inline-flex; fill: currentColor;

    .ykp8pd { color: var(--gm3-sys-color-on-surface-variant, #444746); fill: var(--gm3-sys-color-on-surface-variant, #444746); }
    .oxacD { margin: -.75rem; }
    .NMm5M { fill: currentColor; flex-shrink: 0; }
    .quRWN-Bz112c { display: inline-flex; align-items: center; justify-content: center; font-family: 'Material Symbols Outlined'; font-size: 24px; font-weight: normal; font-style: normal; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; }
    .notranslate { }

    .UTNHae { display: none; }
    .pYTkkf-Bz112c-RLmnJb { display: none; }

    .g0zrjc { fill: var(--gm3-sys-color-surface-container-low, #f8fafd); height: 32px; position: relative; right: 0; top: 0; width: 32px; }
    .bCXrPe { display: none; }
    .Idogi { height: 3rem; margin-top: -.0625rem; transform: none; transition: transform .24s cubic-bezier(.4,0,.2,1); }
    .KEDCCd { display: flex; justify-content: space-between; }
    .TeZa2e { overflow: hidden; }
    .xHPsid { display: flex; margin: 0 .75rem; max-width: 100%; white-space: nowrap; }
    .YJHsie { display: flex; margin-right: .75rem; }
    .QRiHXd { align-items: center; display: flex; flex-direction: row; }

    .gHz6xd {
      background-clip: padding-box;
      display: flex; flex-direction: column;
      height: 18.5rem; overflow: hidden;

    }
    .riU7le {

    }
    .riU7le:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .rZXyy { }

    .O7utsb { height: 100%; left: 0; position: absolute; top: 0; width: 100%; }

    .ZizeYd { opacity: .7; }
    .qm64Ve {
      background: linear-gradient(60deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.7));
      opacity: .88;
      position: absolute; inset: 0;
    }
    .R4EiSb {
      display: flex; flex-direction: column; gap: .25rem;
      padding: 1rem 1rem .5rem; position: relative;
      position: absolute; bottom: 0; left: 0; right: 0;
    }
    .ScpeUc { margin-bottom: .25rem; }
    .XwD7Ke {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 1.5rem; font-weight: 400; letter-spacing: 0; line-height: 2rem;
      color: var(--gm3-sys-color-on-primary, #fff);
    }
    .FWGURc { max-width: 13rem; }
    .Svw0vd {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .875rem; font-weight: 500; letter-spacing: 0; line-height: 1.25rem;
      color: var(--gm3-sys-color-on-primary, #fff);
    }
    .jJIbcc { }
    .T30lh {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .75rem; font-weight: 400; letter-spacing: .00625rem; line-height: 1rem;
      color: var(--gm3-sys-color-on-primary, #fff);
    }
    .lJv9ke { flex: 0 0 4.6875rem; }
    .TQYOZc { display: none; } /* 教師アイコン - 非表示 */
    .PNzAWd { border-radius: 50%; float: right; height: 4.5rem; margin-top: -3.25rem; position: relative; width: 4.5rem; }
    .xo2x2e { display: block; }
    .AX2up {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .75rem; font-weight: 400; letter-spacing: .00625rem; line-height: 1rem;
      color: var(--gm3-sys-color-on-surface, #1f1f1f);
      padding: .75rem 1rem;
    }
    .Y5vSD { display: block; }
    .nforOe { display: none; }
    .SZ0kZe { display: flex; flex-shrink: 0; justify-content: flex-end; padding: .25rem .5rem; border-top: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5); }
    .prWPdf { display: flex; }
    .Vu2fZd { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; display: block; }
    .z07MGc { }
    .slDfNd { text-decoration: none; color: inherit; }
    .ZmqAt { height: 100%; left: 0; position: absolute; top: 0; width: 100%; }

    /* ---- DRAWER COURSE LIST ---- */
    .uTwgne { text-decoration: none; }
    .GRvzhf {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .875rem; font-weight: 500; letter-spacing: 0; line-height: 1.25rem;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
    }
    .YVvGBb { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; display: block; }
    .kWQ5wd { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 2.5rem; height: 2.5rem; }
    .JShLh { border-radius: 50%; color: #fff; fill: #fff; flex-shrink: 0; height: 1.5rem; text-align: center; width: 1.5rem; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 600; }
    .TGnLfc { color: #fff; text-transform: uppercase; }
    .VjRxGc { font-family: Google Sans,Roboto,Arial,sans-serif; font-size: .875rem; font-weight: 500; letter-spacing: 0; line-height: 1.25rem; color: var(--gm3-sys-color-on-surface, #1f1f1f); }
    .FeltXd { color: rgb(23,78,166); fill: rgb(23,78,166); }
    .uUMf4c { background-color: rgb(232,240,254); }
    .Ij01W { margin-left: .75rem; flex: 1; min-width: 0; }
    .NsMoi { border-radius: 50%; bottom: 0; height: 300%; left: -100%; position: absolute; top: -100%; right: 0; width: 300%; }
    .pzaVke { z-index: -1; position: absolute; inset: 0; overflow: hidden; }
    .NJyEeb { display: block; }
    .npdi5 { display: flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; }

    /* ---- THEME COLORS (各コースのテーマ色) ---- */
    .CNpREd.ee1HBc .uUMf4c  { background-color: rgb(232,240,254); }
    .CNpREd.ee1HBc .JShLh   { background-color: rgb(66,133,244); }
    .CNpREd.ee1HBc .lmPo4   { background-color: rgb(25,103,210); }
    .CNpREd.g2MItd .JShLh   { background-color: rgb(52,168,83); }
    .CNpREd.g2MItd .lmPo4   { background-color: rgb(30,132,73); }
    .CNpREd.zvzLKc .JShLh   { background-color: rgb(234,67,53); }
    .CNpREd.zvzLKc .lmPo4   { background-color: rgb(197,34,31); }
    .CNpREd.UvHKof .JShLh   { background-color: rgb(251,188,5); }
    .CNpREd.UvHKof .lmPo4   { background-color: rgb(232,152,0); }
    .CNpREd.Ag4wUb .JShLh   { background-color: rgb(25,103,210); }
    .CNpREd.Ag4wUb .lmPo4   { background-color: rgb(23,78,166); }

    /* カードヘッダーのテーマ背景色 */
    .CNpREd.ee1HBc .O7utsb { background-color: rgb(66,133,244); }
    .CNpREd.g2MItd .O7utsb { background-color: rgb(52,168,83); }
    .CNpREd.zvzLKc .O7utsb { background-color: rgb(234,67,53); }
    .CNpREd.UvHKof .O7utsb { background-color: rgb(251,188,5); }
    .CNpREd.Ag4wUb .O7utsb { background-color: rgb(25,103,210); }

    /* ===== 独自レイアウト (Classroomのレイアウト補完) ===== */

    /* メインコンテンツ */
    .app-main {
      margin-top: 4rem;
      min-height: calc(100vh - 4rem);
    }

    /* ドロワーオーバーレイ */
    .drawer-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.32);
      z-index: 300;
    }
    .drawer-overlay.open { display: block; }

    /* サイドドロワー本体 */
    .side-drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 18.75rem;
      background: var(--gm3-sys-color-surface-container-low, #f8fafd);
      z-index: 400;
      transform: translateX(-100%);
      transition: transform .24s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
      box-shadow: none;
    }
    .side-drawer.open {
      transform: translateX(0);
      box-shadow: 4px 0 16px rgba(0,0,0,.15);
    }

    /* ドロワーヘッダー */
    .drawer-topbar {
      height: 4rem;
      display: flex; align-items: center;
      padding: 0 .5rem 0 1.5rem;
      gap: .5rem;
    }

    /* ドロワーナビアイテム */
    .drawer-nav-item {
      display: flex; align-items: center;
      height: 3rem;
      padding: 0 1.5rem;
      text-decoration: none;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      border-radius: 0 1.5rem 1.5rem 0;
      margin-right: .5rem;
      cursor: pointer;
      transition: background .15s;
      position: relative;
      overflow: hidden;
    }
    .drawer-nav-item:hover { background: rgba(68,71,70,.08); }
    .drawer-nav-item.active {
      background: var(--gm3-sys-color-primary-container, #d3e3fd);
      color: var(--gm3-sys-color-on-primary-fixed-variant, #0842a0);
      font-weight: 500;
    }
    .drawer-nav-item-icon {
      display: flex; align-items: center; justify-content: center;
      width: 2.5rem; height: 2.5rem; flex-shrink: 0;
      font-family: 'Material Symbols Outlined'; font-size: 24px;
      color: inherit;
    }
    .drawer-nav-item-label {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .875rem; font-weight: 500;
      margin-left: .75rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .drawer-divider {
      border: none; border-top: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      margin: .5rem 0;
    }
    .drawer-section-label {
      padding: .75rem 1.5rem .25rem;
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .75rem; font-weight: 700;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      text-transform: none;
      letter-spacing: .5px;
    }

    /* ===== コースカードグリッド ===== */
    .courses-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.5rem;
    }

    /* ===== ビュー切り替え ===== */
    .gc-view { display: none; }
    .gc-view.active { display: block; }

    /* ===== ストリーム・課題ビュー ===== */
    .stream-container {
      max-width: 62rem;
      margin: 0 auto;
      padding: 0;
    }

    /* コースバナー */
    .course-banner {
      border-radius: 0;
      overflow: hidden;
      height: 14rem;
      position: relative;
      margin-bottom: 0;
    }
    .course-banner-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
    }
    .course-banner-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.05) 0%, rgba(0,0,0,.35) 100%);
    }
    .course-banner-text {
      position: absolute; bottom: 1.5rem; left: 1.5rem; right: 1.5rem;
      color: #fff;
    }
    .course-banner-name {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 2.25rem; font-weight: 400; line-height: 1.1;
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .course-banner-sub {
      font-size: .875rem; opacity: .9; margin-top: .25rem;
    }

    /* ストリームカード */
    .stream-card {
      background: var(--gm3-sys-color-surface, #fff);
      border-radius: .5rem;
      border: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      margin-bottom: 1rem;
      overflow: hidden;
      transition: box-shadow .2s;
    }
    .stream-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }

    .stream-card-top {
      display: flex; align-items: flex-start;
      padding: 1rem 1rem .5rem;
      gap: .75rem;
    }
    .stream-card-icon {
      width: 2.5rem; height: 2.5rem;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Material Symbols Outlined'; font-size: 20px;
    }
    .stream-card-icon.assignment { background: #e8f0fe; color: #1a73e8; }
    .stream-card-icon.announcement { background: #fce8e6; color: #d93025; }
    .stream-card-meta { flex: 1; min-width: 0; }
    .stream-card-course {
      font-size: .75rem; font-weight: 500;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      margin-bottom: .125rem;
    }
    .stream-card-title {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 1rem; font-weight: 500;
      color: var(--gm3-sys-color-on-surface, #1f1f1f);
      cursor: pointer; line-height: 1.3;
    }
    .stream-card-title:hover { color: #1a73e8; }
    .stream-card-time {
      font-size: .75rem;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      margin-top: .25rem;
    }
    .stream-card-body {
      padding: .5rem 1rem .75rem 4.25rem;
      font-size: .875rem;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      line-height: 1.5;
    }
    .stream-card-actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: .5rem 1rem .5rem 4.25rem;
      border-top: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
    }
    .stream-due {
      display: flex; align-items: center; gap: .25rem;
      font-size: .75rem; color: var(--gm3-sys-color-on-surface-variant, #444746);
      font-family: 'Material Symbols Outlined', Roboto, sans-serif;
    }
    .stream-due .icon { font-family: 'Material Symbols Outlined'; font-size: 16px; }
    .stream-due.urgent { color: #d93025; }
    .stream-due.soon   { color: #e37400; }

    .open-link {
      display: inline-flex; align-items: center; gap: .25rem;
      font-size: .875rem; font-weight: 500; font-family: Google Sans,Roboto,Arial,sans-serif;
      color: #1a73e8; text-decoration: none;
      padding: .375rem .75rem;
      border-radius: .25rem;
      transition: background .15s;
    }
    .open-link:hover { background: #e8f0fe; }
    .open-link .icon { font-family: 'Material Symbols Outlined'; font-size: 16px; }

    /* ===== 課題ページ (Classwork) ===== */
    .classwork-container {
      max-width: 55rem; margin: 0 auto; padding: 1.5rem;
    }

    .classwork-page-header {
      display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem;
    }
    .classwork-page-title {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 1.375rem; font-weight: 400;
    }

    .topic-section { margin-bottom: 1rem; }
    .topic-header {
      display: flex; align-items: center;
      padding: 1.25rem 0 .5rem;
      border-bottom: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      cursor: pointer; gap: .5rem;
    }
    .topic-title {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 1.375rem; font-weight: 400;
      flex: 1; color: var(--gm3-sys-color-on-surface, #1f1f1f);
    }
    .topic-chevron {
      font-family: 'Material Symbols Outlined'; font-size: 24px;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      transition: transform .2s;
    }
    .topic-header.collapsed .topic-chevron { transform: rotate(-90deg); }

    .work-list {
      background: var(--gm3-sys-color-surface, #fff);
      border-radius: 0 0 .5rem .5rem;
      overflow: hidden;
    }

    .work-item {
      display: flex; align-items: center;
      padding: .75rem 1rem;
      border-bottom: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      cursor: pointer; transition: background .15s;
      background: var(--gm3-sys-color-surface, #fff);
    }
    .work-item:last-child { border-bottom: none; }
    .work-item:hover { background: #f8f9fa; }

    .work-item-icon {
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-right: 1rem;
      font-family: 'Material Symbols Outlined'; font-size: 20px;
    }
    .work-item-icon.assignment { background: #e8f0fe; color: #1a73e8; }
    .work-item-icon.done-icon  { background: #e6f4ea; color: #1e8e3e; }
    .work-item-info { flex: 1; min-width: 0; }
    .work-item-title {
      font-size: .875rem; font-weight: 500;
      color: var(--gm3-sys-color-on-surface, #1f1f1f);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

<script>
'use strict';

/* ========== API ========== */
const userEmail = '<?= userEmail ?>';

// google.script.run をPromiseでラップ
function gasRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => reject(new Error(e.message || String(e))))
      [fnName](...args);
  });
}

function getClassroomData() { return gasRun('getClassroomData'); }
function forceRefresh()      { return gasRun('forceRefresh'); }

/* ========== IndexedDB キャッシュ（永続・TTLなし）========== */
const IDB_NAME    = 'gc_cache';
const IDB_STORE   = 'data';
const IDB_KEY     = 'classroom_v2_' + userEmail;  // ユーザーごとに分離
let   _idb        = null;   // DBインスタンス（一度開いたら使い回す）

function idbOpen() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror   = () => reject(req.error);
  });
}

async function lsSave(data) {
  try {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx  = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).put({ data, savedAt: Date.now() }, IDB_KEY);
      req.onsuccess = () => resolve();
      req.onerror   = () => reject(req.error);
    });
  } catch(_) {}
}

async function lsLoad() {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx  = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => resolve(req.result ? req.result.data : null);
      req.onerror   = () => resolve(null);
    });
  } catch(_) { return null; }
}

async function lsClear() {
  try {
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx  = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = () => resolve();
    });
  } catch(_) {}
}

function courseThemeImg(id) {

function hashStr(s) {

}

/* ========== 日付ユーティリティ ========== */
const TODAY = (()=>{ const d=new Date(); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; })();
const DOW = ['日','月','火','水','木','金','土'];

function parseDt(s) {
  if (!s||s==='未定') return null;
  const p=String(s).split(/[\/\-]/);
  return p.length<3 ? null : new Date(+p[0],+p[1]-1,+p[2]);
}

function diffDays(s) {
  const d=parseDt(s); if(!d) return null;
  const t=parseDt(TODAY); return Math.round((d-t)/86400000);
}

function fmtDate(s) {
  if (!s||s==='未定') return '期限なし';
  const d=parseDt(s); if(!d) return s;
  const diff=diffDays(s);
  if(diff===0) return '今日';
  if(diff===1) return '明日';
  if(diff===-1) return '昨日';
  if(diff!==null&&diff>0&&diff<=7) return `${diff}日後 (${d.getMonth()+1}/${d.getDate()})`;
  return `${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`;
}

// ストリームカード用の日付表示（「昨日」「5月8日」形式）
function fmtCreatedAt(s) {
  if (!s) return '';
  const d=parseDt(s); if(!d) return s;
  const diff=diffDays(s);
  if(diff===0) return '今日';
  if(diff===-1) return '昨日';
  const thisYear=new Date().getFullYear();
  if(d.getFullYear()===thisYear) return `${d.getMonth()+1}月${d.getDate()}日`;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function fmtDateLong(s) {
  const d=parseDt(s); if(!d) return s;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`;
}

function urgCls(s) {
  const d=diffDays(s); if(d===null) return '';
  if(d<0) return 'urgent'; if(d<=2) return 'urgent'; if(d<=5) return 'soon'; return '';
}

function applyData(data) {
  cachedCourses     = data.courses     || [];

// 差分チェック: コース数・課題数・お知らせ数が変わったら差分ありとみなす
function hasChanged(oldData, newData) {
  if (!oldData) return true;
  return (
    (oldData.courses     ||[]).length !== (newData.courses     ||[]).length ||
    (oldData.courseWorks ||[]).length !== (newData.courseWorks ||[]).length ||
    (oldData.announcements||[]).length !== (newData.announcements||[]).length ||
    (oldData.materials   ||[]).length !== (newData.materials   ||[]).length
  );
}

async function loadHome(force) {
  const el=document.getElementById('home-content');

  if (force) {
    await lsClear();
    cachedCourses=[];
  }

  // 1. メモリキャッシュがあれば即時描画
  if (cachedCourses.length) {
    renderHome();
    renderDrawerCourses();
    // バックグラウンドで差分チェック
    _bgRefresh();
    return;
  }

  // 2. IndexedDBキャッシュがあれば即時描画（TTLなし・永続）
  const idbData = await lsLoad();
  if (idbData) {
    applyData(idbData);
    renderHome();
    renderDrawerCourses();
    // バックグラウンドでGASから取得 → 差分があれば静かに再描画
    _bgRefresh(idbData);
    return;
  }

  // 3. キャッシュなし（初回）: ローディング → GAS取得
  el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try {
    const data = await getClassroomData();
    if (!data || !data.success) throw new Error(data && data.error || '取得失敗');
    applyData(data);
    lsSave(data);
    renderHome();
    renderDrawerCourses();
  } catch(e) {
    el.innerHTML=`<div style="padding:1.5rem;"><div style="background:#fce8e6;border-left:4px solid #d93025;padding:.75rem 1rem;border-radius:.25rem;color:#c5221f;font-size:.875rem;">読み込みエラー: ${esc(e.message)}</div></div>`;
  }
}

// バックグラウンド差分リフレッシュ
let _bgRunning = false;
function _bgRefresh(prevData) {
  if (_bgRunning) return;
  _bgRunning = true;
  getClassroomData().then(data => {
    _bgRunning = false;
    if (!data || !data.success) return;
    if (hasChanged(prevData || { courses: cachedCourses, courseWorks: cachedCourseWorks, announcements: cachedAnns, materials: cachedMaterials }, data)) {
      applyData(data);
      lsSave(data);
      // 現在表示中のビューを再描画
      if (currentView==='home')           { renderHome(); renderDrawerCourses(); }
      else if (currentView==='stream')    { _renderStream(currentCourseId, document.getElementById('stream-content')); }
      else if (currentView==='classwork') { _renderClasswork(currentCourseId, document.getElementById('classwork-content')); }
      else if (currentView==='todo')      { renderTodo(); }
    } else {
      // 差分なし: IndexedDBのsavedAtだけ更新
      lsSave(data);
    }
  }).catch(() => { _bgRunning = false; });
}

  let html=`
    <div class="course-banner" style="max-width:62rem;margin:0 auto 0;border-radius:0 0 .75rem .75rem;">
      <div class="course-banner-bg" style="background-image:url('${img}');background-color:${color};"></div>
      <div class="course-banner-overlay"></div>
      <div class="course-banner-text">
        <div class="course-banner-name">${esc(c.name)}</div>
        ${c.section?`<div class="course-banner-sub">${esc(c.section)}</div>`:''}
      </div>
    </div>`;

  // タブ
  html+=`<div style="max-width:62rem;margin:0 auto;">
    <div class="course-tabs" style="border-radius:0;border-left:none;border-right:none;border-top:none;">
      <button class="course-tab active">ストリーム</button>
      <button class="course-tab" onclick="openCourseClasswork('${esc(cid)}')">授業</button>
    </div>
  </div>`;

  // ストリーム本体（左:フィード、右:サイドバー）
  html+=`<div class="stream-layout">
    <div class="stream-main">`;

  if(!items.length){
    html+=`<div class="empty-state"><span class="icon">forum</span><h3>投稿はありません</h3></div>`;
  } else {
    items.forEach(item=>{ html+=buildStreamCard(item); });
  }

  html+=`</div>`;

  // サイドバー
  html+=`<div class="stream-sidebar">
    <div class="sidebar-card">
      <div class="sidebar-card-header">近日の課題</div>`;
  if(!upcoming.length){
    html+=`<div style="padding:.75rem 1rem;font-size:.875rem;color:var(--gm3-sys-color-on-surface-variant,#444746);">提出期限が近い課題はありません</div>`;
  } else {
    upcoming.forEach(t=>{
      const urg=urgCls(t.deadline);
      html+=`
      <div class="sidebar-upcoming-item" onclick="openDetail(${JSON.stringify(JSON.stringify(t))})">
        <div class="sidebar-upcoming-title">${esc(t.title||'')}</div>
        <div class="sidebar-upcoming-due ${urg}">
          <span class="mat-icon">event</span>${esc(fmtDate(t.deadline))}
        </div>
      </div>`;
    });
  }
  html+=`</div>

    <div class="sidebar-card">
      <a class="sidebar-card-item" href="${esc(c.alternateLink||'#')}" target="_blank">
        <span class="mat-icon">open_in_new</span>
        <span class="sidebar-card-item-label">Classroomで開く</span>
      </a>
    </div>
  </div>`;

  html+=`</div>`; // stream-layout終わり

  el.innerHTML=html;
}

function buildStreamCard(item) {
  const isTask=item.type==='assignment';
  const isMaterial=item.type==='material';
  const isAnn=item.type==='announcement';
  const title=item.title||'（タイトルなし）';
  const desc=item.description||'';
  const dl=item.deadline||'';
  const urg=isTask?urgCls(dl):'';
  const dueLabel=dl&&dl!=='未定'?fmtDate(dl):'';
  const aid=esc(item.id||'');
  const dateStr=fmtCreatedAt(item.created_at||'');

  // アイコン
  const iconName = isTask?'assignment':isMaterial?'description':'campaign';
  const iconBg   = isTask?'#e8f0fe':isMaterial?'#e6f4ea':'#fce8e6';
  const iconClr  = isTask?'rgb(26,115,232)':isMaterial?'rgb(30,142,62)':'rgb(217,48,37)';
  // iconコンテナはuUMf4c(青bg)/FeltXd(青色)などClassroomの実クラス
  const iconBgClass = isTask?'uUMf4c FeltXd':isMaterial?'':'';

  // 「〇〇さんが投稿しました」テキスト
  let actionText='';
  if(isTask)      actionText=`新しい課題: 「${title}」`;
  else if(isMaterial) actionText=`新しい資料を投稿しました: ${title}`;
  else            actionText=`お知らせを投稿しました`;

  // 本物Classroomのカード構造
  return `
  <div class="stream-card-real" id="sc-${aid}">
    <div class="card-top">
      <div class="JZicYb">
        <div class="Cxyznd IqHgie" style="background:${iconBg};color:${iconClr};">${iconName}</div>
      </div>
      <div class="GQW44b">
        <div class="QUEiXc">
          <h2>
            <span class="jzdBjc" onclick="openDetail(${JSON.stringify(JSON.stringify(item))})">${esc(actionText)}</span>
          </h2>
          <span class="JZk9qf">${esc(dateStr)}</span>
        </div>
        ${isTask&&item.completed?`<div style="display:inline-flex;align-items:center;gap:.25rem;font-size:.75rem;color:#1e8e3e;margin-top:.125rem;"><span style="font-family:'Material Symbols Outlined';font-size:14px;">check_circle</span>提出済み</div>`:''}
        ${isTask&&!item.completed&&dueLabel?`<div class="VjRxGc" style="font-size:.75rem;font-weight:400;color:var(--gm3-sys-color-on-surface-variant,#444746);margin-top:.125rem;">締切: ${esc(dueLabel)}</div>`:''}
        ${isAnn&&desc?`<div class="VjRxGc" style="font-size:.875rem;font-weight:400;color:var(--gm3-sys-color-on-surface-variant,#444746);margin-top:.25rem;white-space:pre-wrap;word-break:break-word;">${esc(desc.length>200?desc.slice(0,200)+'…':desc)}</div>`:''}
      </div>
    </div>
    <div class="card-footer">
      <div class="deadline-badge ${urg}">
        ${isTask&&dueLabel?`<span class="mat-icon">event</span>${esc(dueLabel)}`:''}
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;">
        ${isTask?`<button class="check-btn ${item.completed?'done':''}" onclick="toggleTask('${aid}',this)" title="${item.completed?'提出を取り消す':'提出済みにする'}">${item.completed?'<span style="font-family:\'Material Symbols Outlined\';font-size:18px;">check</span>':''}</button>`:''}
        ${item.link?`<a class="open-link" href="${esc(item.link)}" target="_blank"><span class="icon">open_in_new</span>開く</a>`:''}
      </div>
    </div>
  </div>`;
}

/* ========== CLASSWORK ========== */
async function loadClasswork(params) {
  const cid=(params&&params.courseId)||currentCourseId;
  const el=document.getElementById('classwork-content');
  if (!cachedCourses.length) el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try {
    await ensureData();
    renderDrawerCourses();
  } catch(e) {
    el.innerHTML=`<div style="padding:1.5rem;color:#c5221f;">読み込みエラー: ${esc(e.message)}</div>`; return;
  }
  _renderClasswork(cid, el);
}

function _renderClasswork(cid, el) {
  const c=cachedCourses.find(x=>String(x.id)===String(cid))||{id:cid,name:'クラス'};
  const tasks=cachedCourseWorks.filter(t=>String(t.course_id)===String(cid))
                               .sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
  const color=courseColor(cid);
  const img=courseThemeImg(cid);

  let html=`
    <div class="course-banner" style="max-width:62rem;margin:0 auto;border-radius:0 0 .75rem .75rem;">
      <div class="course-banner-bg" style="background-image:url('${img}');background-color:${color};"></div>
      <div class="course-banner-overlay"></div>
      <div class="course-banner-text">
        <div class="course-banner-name">${esc(c.name)}</div>
        ${c.section?`<div class="course-banner-sub">${esc(c.section)}</div>`:''}
      </div>
    </div>
    <div style="max-width:62rem;margin:0 auto;">
      <div class="course-tabs" style="border-radius:0;border-left:none;border-right:none;border-top:none;">
        <button class="course-tab" onclick="openCourse('${esc(cid)}')">ストリーム</button>
        <button class="course-tab active">授業</button>
      </div>
    </div>
    <div class="classwork-container">
    <div class="classwork-page-header" style="display:none;"></div>`;

  if(!tasks.length){
    html+=`<div class="empty-state"><span class="icon">assignment</span><h3>課題はありません</h3></div></div>`;
    el.innerHTML=html; return;
  }

  // グループ分け
  const grps={};
  const ORDER=['今日まで','明日まで','今週中','それ以降','期限なし','期限切れ'];
  tasks.forEach(t=>{
    const diff=diffDays(t.deadline);
    let g;
    if(!t.deadline||t.deadline==='未定') g='期限なし';
    else if(diff<0)   g='期限切れ';
    else if(diff===0) g='今日まで';
    else if(diff===1) g='明日まで';
    else if(diff<=7)  g='今週中';
    else              g='それ以降';
    if(!grps[g]) grps[g]=[];
    grps[g].push(t);
  });

  ORDER.filter(g=>grps[g]).forEach(g=>{
    html+=`
    <div class="topic-section">
      <div class="topic-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.style.display=this.classList.contains('collapsed')?'none':'block'">
        <span class="topic-title">${g}</span>
        <span class="topic-chevron notranslate" style="font-family:'Material Symbols Outlined';font-size:24px;">expand_more</span>
      </div>
      <div class="work-list">`;
    grps[g].forEach(t=>{ html+=buildWorkItem(t); });
    html+=`</div></div>`;
  });
  html+=`</div>`; // classwork-container終わり
  el.innerHTML=html;
}

function buildWorkItem(item) {
  const done=item.completed;
  const dl=item.deadline||'';
  const urg=urgCls(dl);
  const dueLabel=dl&&dl!=='未定'?fmtDate(dl):'期限なし';
  const aid=esc(item.id||'');
  let chip='';
  if(urg==='urgent'&&diffDays(dl)<0) chip=`<span style="font-size:.6875rem;padding:.125rem .5rem;border-radius:.75rem;background:#fce8e6;color:#d93025;font-weight:600;">期限切れ</span>`;
  else if(urg==='urgent') chip=`<span style="font-size:.6875rem;padding:.125rem .5rem;border-radius:.75rem;background:#fce8e6;color:#d93025;font-weight:600;">急ぎ</span>`;
  else if(urg==='soon')   chip=`<span style="font-size:.6875rem;padding:.125rem .5rem;border-radius:.75rem;background:#fef7e0;color:#e37400;font-weight:600;">まもなく</span>`;

  return `
  <div class="work-item" id="wi-${aid}" onclick="openDetail(${JSON.stringify(JSON.stringify(item))})">
    <div class="work-item-icon ${done?'done-icon':'assignment'}">${done?'assignment_turned_in':'assignment'}</div>
    <div class="work-item-info">
      <div class="work-item-title ${done?'done':''}">${esc(item.title||'（タイトルなし）')}</div>
      <div class="work-item-meta">
        <span class="subject-pill" style="background:#e8f0fe;color:#1a73e8;">${esc(item.course_name||'')}</span>
        <div class="work-item-due ${urg}">
          <span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:14px;">event</span>
          ${esc(dueLabel)}
        </div>
        ${chip}
      </div>
    </div>
    <div class="work-item-right" onclick="event.stopPropagation()">
      <button class="check-btn ${done?'done':''}"
        onclick="toggleTask('${aid}',this)"
        title="${done?'完了済み（クリックで戻す）':'完了にする'}">
        ${done?'<span style="font-family:\'Material Symbols Outlined\';font-size:18px;">check</span>':'<span style="font-family:\'Material Symbols Outlined\';font-size:18px;color:transparent;">check</span>'}
      </button>
    </div>
  </div>`;
}

/* ========== TODO ========== */
async function loadTodo(force) {
  const el=document.getElementById('todo-content');
  if (force) { await lsClear(); cachedCourses=[]; }
  if (!cachedCourseWorks.length) el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try {
    await ensureData();
    renderTodo();
  } catch(e) { el.innerHTML=`<div style="padding:1.5rem;color:#c5221f;">${esc(e.message)}</div>`; }
}

function setTodoFilter(f) {
  todoFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===f));
  renderTodo();
}

function renderTodo() {
  const el=document.getElementById('todo-content');
  let tasks=[...cachedCourseWorks];
  if(todoFilter==='upcoming') tasks=tasks.filter(t=>!t.completed);
  if(todoFilter==='done')     tasks=tasks.filter(t=>t.completed);
  if(todoFilter==='overdue')  tasks=tasks.filter(t=>!t.completed&&diffDays(t.deadline)!==null&&diffDays(t.deadline)<0);
  tasks.sort((a,b)=>(a.deadline||'9999/99/99').localeCompare(b.deadline||'9999/99/99'));

  let html=`
    <div class="todo-page-title">To-do</div>
    <div class="filter-row">
      <button class="filter-chip ${todoFilter==='upcoming'?'active':''}" data-filter="upcoming" onclick="setTodoFilter('upcoming')"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:16px;">schedule</span> 近日</button>
      <button class="filter-chip ${todoFilter==='done'?'active':''}" data-filter="done" onclick="setTodoFilter('done')"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:16px;">check_circle</span> 完了済み</button>
      <button class="filter-chip ${todoFilter==='overdue'?'active':''}" data-filter="overdue" onclick="setTodoFilter('overdue')"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:16px;">warning</span> 期限切れ</button>
    </div>`;

  if(!tasks.length){
    html+=`<div class="empty-state"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:64px;color:var(--gm3-sys-color-outline-variant,#c4c7c5);">check_circle_outline</span><h3>${todoFilter==='done'?'完了した課題はありません':todoFilter==='overdue'?'期限切れはありません！':'すべて完了しています！'}</h3></div>`;
  } else {
    const grps={},gOrder=[];
    tasks.forEach(t=>{
      const diff=diffDays(t.deadline);
      let g;
      if(!t.deadline||t.deadline==='未定') g='期限なし';
      else if(diff<0)   g='期限切れ';
      else if(diff===0) g='今日';
      else if(diff===1) g='明日';
      else              g=fmtDateLong(t.deadline);
      if(!grps[g]){grps[g]=[];gOrder.push(g);}
      grps[g].push(t);
    });
    gOrder.forEach(g=>{
      html+=`<div class="todo-date-label">${esc(g)}</div>
        <div style="background:var(--gm3-sys-color-surface,#fff);border-radius:.5rem;margin-bottom:.5rem;overflow:hidden;border:.0625rem solid var(--gm3-sys-color-outline-variant,#c4c7c5);">`;
      grps[g].forEach(t=>{ html+=buildWorkItem(t); });
      html+=`</div>`;
    });
  }
  el.innerHTML=html;
}

/* ========== 課題完了トグル ========== */
function toggleTask(taskId, btn) {
  const done=btn.classList.contains('done');
  const newVal=!done;

  // 楽観的UI更新: ボタン全部（同じtaskIdが複数箇所にある）
  document.querySelectorAll(`[onclick*="'${taskId}'"]`).forEach(b => {
    if(b.classList.contains('check-btn')) {
      if(newVal) {
        b.classList.add('done');
        b.innerHTML='<span style="font-family:\'Material Symbols Outlined\';font-size:18px;">check</span>';
        b.title='提出を取り消す';
      } else {
        b.classList.remove('done');
        b.innerHTML='';
        b.title='提出済みにする';
      }
    }
  });

  // メモリキャッシュ更新
  cachedCourseWorks=cachedCourseWorks.map(t=>t.id===taskId?{...t,completed:newVal}:t);
  snack(newVal?'✓ 提出済みにしました':'提出を取り消しました');
  if(currentView==='todo') renderTodo();

  // GAS PropertiesService に永続化（引数: courseWorkId, completed）
  gasRun('setTaskCompleted', taskId, newVal).catch(()=>{});
}

/* ========== 詳細モーダル ========== */
function openDetail(itemJson) {
  const item=typeof itemJson==='string'?JSON.parse(itemJson):itemJson;
  const isTask=item.type==='assignment';
  const isMaterial=item.type==='material';

  const icon=document.getElementById('detail-icon');
  icon.className='detail-header-icon '+(isTask?'assignment':isMaterial?'material':'announcement');
  icon.textContent=isTask?'assignment':isMaterial?'description':'campaign';

  document.getElementById('detail-title').textContent=item.title||'（タイトルなし）';
  document.getElementById('detail-subtitle').textContent=item.course_name||'';

  const dueRow=document.getElementById('detail-due-row');
  if(isTask&&item.deadline&&item.deadline!=='未定'){
    document.getElementById('detail-due').textContent=fmtDateLong(item.deadline)+' まで';
    dueRow.style.display='flex';
  } else { dueRow.style.display='none'; }

  document.getElementById('detail-subject').textContent=item.course_name||'';
  const descEl=document.getElementById('detail-desc');
  descEl.textContent=item.description||'';
  descEl.style.display=item.description?'block':'none';

  const openBtn=document.getElementById('detail-open-btn');
  openBtn.href=item.link||'#';
  openBtn.style.display=item.link?'inline-flex':'none';

  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(e) {
  if(e&&e.target!==document.getElementById('detail-overlay')) return;
  document.getElementById('detail-overlay').classList.remove('open');
}

/* ========== ポーリング（共有サマリー差分通知）========== */
// 仕組み:
//   誰かがgetClassroomData()を呼ぶとScriptPropertiesに
//   {cwCount, annCount, matCount, latestTime, writtenAt} が書き込まれる。
//   他のユーザーは30秒ごとにgetSharedSummary()でそれを読むだけ。
//   Classroom APIは一切叩かないので超軽量。
//   サマリーが自分のキャッシュより新しければバナーを表示する。

const POLL_INTERVAL = 30 * 1000;  // 30秒
let   _pollTimer    = null;
let   _lastWrittenAt = null;  // 最後に確認したwrittenAt
let   _pendingData  = null;   // バックグラウンドで取得済みの新データ
let   _pollActive   = false;  // 二重起動防止

function showUpdateBanner(msg) {
  const banner = document.getElementById('update-banner');
  document.getElementById('update-banner-text').textContent = msg;
  banner.classList.add('show');
}

function hideUpdateBanner() {
  document.getElementById('update-banner').classList.remove('show');
}

// バナータップ: 取得済みデータを適用して再描画
function applyUpdate() {
  hideUpdateBanner();
  if (!_pendingData) return;
  applyData(_pendingData);
  lsSave(_pendingData);
  _pendingData = null;
  if (currentView==='home')           { renderHome(); renderDrawerCourses(); }
  else if (currentView==='stream')    { _renderStream(currentCourseId, document.getElementById('stream-content')); }
  else if (currentView==='classwork') { _renderClasswork(currentCourseId, document.getElementById('classwork-content')); }
  else if (currentView==='todo')      { renderTodo(); }
  snack('更新しました');
}

async function pollOnce() {
  if (_pollActive) return;
  _pollActive = true;
  try {
    // ScriptPropertiesを読むだけ — Classroom API不使用・クォータ消費なし
    const summary = await gasRun('getSharedSummary');
    if (!summary || !summary.success || summary.empty) return;

    const { cwCount, annCount, matCount, latestTime, writtenAt } = summary;

    // 初回: ベースラインを記録するだけ
    if (!_lastWrittenAt) {
      _lastWrittenAt = writtenAt;
      return;
    }

    // writtenAtが更新されていれば誰かが新しいデータを書き込んだ
    if (writtenAt === _lastWrittenAt) return;
    _lastWrittenAt = writtenAt;

    // 自分のキャッシュと比較して実際に差分があるか確認
    const myChanged =
      cwCount  !== cachedCourseWorks.length ||
      annCount !== cachedAnns.length        ||
      matCount !== cachedMaterials.length   ||
      latestTime > (cachedCourseWorks[0] && cachedCourseWorks[0].created_at || '');

    if (!myChanged) return;

    // 差分あり: バックグラウンドでフルデータ取得（キャッシュクリアして最新を強制取得）
    const data = await gasRun('forceRefresh');
    if (!data || !data.success) return;

    _pendingData = data;

    // 新着件数のメッセージを組み立て
    const newCw  = Math.max(0, (data.courseWorks   ||[]).length - cachedCourseWorks.length);
    const newAnn = Math.max(0, (data.announcements ||[]).length - cachedAnns.length);
    const newMat = Math.max(0, (data.materials     ||[]).length - cachedMaterials.length);
    let msg = '新しい投稿があります';
    const parts = [];
    if (newCw  > 0) parts.push(`課題${newCw}件`);
    if (newAnn > 0) parts.push(`お知らせ${newAnn}件`);
    if (newMat > 0) parts.push(`資料${newMat}件`);
    if (parts.length) msg = parts.join('・') + 'の新着';
    showUpdateBanner(msg + ' — タップして更新');

  } catch(_) {}
  finally { _pollActive = false; }
}

function startPolling() {
  if (_pollTimer) return;
  // 起動直後にベースラインを取得
  gasRun('getSharedSummary').then(s => {
    if (s && s.success && !s.empty) _lastWrittenAt = s.writtenAt;
  }).catch(()=>{});
  _pollTimer = setInterval(pollOnce, POLL_INTERVAL);
}

function stopPolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

// タブが非表示 → ポーリング停止（バッテリー・クォータ節約）
// タブに戻る  → 再開 + 即チェック
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopPolling(); }
  else { startPolling(); pollOnce(); }
});

/* ========== 初期化 ========== */
(function init(){
  try {
    const p=new URLSearchParams(window.location.search);
    const tab=p.get('tab');
    if(['home','todo','stream','classwork'].includes(tab)) showView(tab);
    else showView('home');
  } catch(_){ showView('home'); }
  // データ読み込み完了後にポーリング開始
  // (loadHomeのIndexedDB/GAS取得が終わってからベースライン記録)
  setTimeout(startPolling, 5000);
})();
</script>
