    /* ===== 独自レイアウト ===== */

    }

    .drawer-overlay {

      background: rgba(0,0,0,.32);

    }
    .drawer-overlay.open { display: block; }

    .side-drawer {

      top: 0; left: 0; bottom: 0;
      width: 18.75rem;
      background: var(--gm3-sys-color-surface-container-low, #f8fafd);
      z-index: 400;
      transform: translateX(-100%);
      transition: transform .24s cubic-bezier(.4,0,.2,1);
      overflow-y: auto;
      box-shadow: none;
    }
    .side-drawer.open {
      transform: translateX(0);
      box-shadow: 4px 0 16px rgba(0,0,0,.15);
    }

    .drawer-topbar {
      height: 4rem;
      display: flex; align-items: center;
      padding: 0 .5rem 0 1.5rem;
      gap: .5rem;
    }

    .drawer-nav-item {
      display: flex; align-items: center;
      height: 3rem;
      padding: 0 1.5rem;
      text-decoration: none;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      border-radius: 0 1.5rem 1.5rem 0;
      margin-right: .5rem;
      cursor: pointer;

      position: relative;
      overflow: hidden;

      background: var(--gm3-sys-color-primary-container, #d3e3fd);
      color: var(--gm3-sys-color-on-primary-fixed-variant, #0842a0);

    .drawer-nav-item-icon {
      display: flex; align-items: center; justify-content: center;
      width: 2.5rem; height: 2.5rem; flex-shrink: 0;
      font-family: 'Material Symbols Outlined'; font-size: 24px;

    .drawer-nav-item-label {
      font-family: Google Sans,Roboto,Arial,sans-serif;

    .drawer-divider {

    /* ===== コースカードグリッド ===== */

    .course-banner-name {
      font-family: Google Sans,Roboto,Arial,sans-serif;

      display: flex; align-items: flex-start; justify-content: flex-start;
      flex-shrink: 0; margin-right: .75rem;
    }
    .Cxyznd.IqHgie {
      width: 2.5rem; height: 2.5rem;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;

    .QUEiXc h2 { flex: 1; min-width: 0; font-size: 1rem; font-weight: 400; line-height: 1.4; }
    .jzdBjc {

    .deadline-badge.urgent { color: #d93025; }
    .deadline-badge.soon   { color: #e37400; }

    /* ===== 課題ページ ===== */
    .classwork-container {
      max-width: 55rem; margin: 0 auto; padding: 1.5rem;
    }
    .topic-section { margin-bottom: 1rem; }
    .topic-header {
      display: flex; align-items: center;
      padding: 1.25rem 0 .5rem;

    .topic-chevron {

    .work-list {
      background: var(--gm3-sys-color-surface, #fff);
      border-radius: 0 0 .5rem .5rem;
      overflow: hidden;
    }
    .work-item {
      display: flex; align-items: center;
      padding: .75rem 1rem;
      border-bottom: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      cursor: pointer; transition: background .15s;

    .work-item:last-child { border-bottom: none; }
    .work-item:hover { background: #f8f9fa; }
    .work-item-icon {
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;

      font-family: 'Material Symbols Outlined'; font-size: 20px;

    .work-item-icon.assignment { background: #e8f0fe; color: #1a73e8; }
    .work-item-icon.done-icon  { background: #e6f4ea; color: #1e8e3e; }

    .work-item-title {
      font-size: .875rem; font-weight: 500;
      color: var(--gm3-sys-color-on-surface, #1f1f1f);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

    .work-item-title.done { text-decoration: line-through; color: var(--gm3-sys-color-on-surface-variant, #444746); }
    .work-item-meta {
      display: flex; align-items: center; gap: .5rem;
      font-size: .75rem; color: var(--gm3-sys-color-on-surface-variant, #444746);

    .work-item-due {
      display: flex; align-items: center; gap: .2rem;

    .work-item-due.urgent { color: #d93025; }
    .work-item-due.soon   { color: #e37400; }
    .subject-pill {
      display: inline-flex; align-items: center;
      height: 1.25rem; padding: 0 .5rem;
      border-radius: .625rem;
      font-size: .6875rem; font-weight: 500;
      white-space: nowrap;
    }
    .work-item-right {
      display: flex; align-items: center; gap: .5rem;
      flex-shrink: 0; margin-left: .5rem;
    }
    .check-btn {
      width: 2.25rem; height: 2.25rem;
      border-radius: 50%; border: 2px solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: transparent; transition: all .15s;
      font-family: 'Material Symbols Outlined'; font-size: 18px;

    .check-btn:hover { border-color: #1e8e3e; color: #1e8e3e; }
    .check-btn.done { background: #1e8e3e; border-color: #1e8e3e; color: #fff; }

    /* ===== To-do ===== */
    .todo-container {
      max-width: 55rem; margin: 0 auto; padding: 1.5rem;
    }
    .todo-page-title {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 1.75rem; font-weight: 400; margin-bottom: 1rem;
    }
    .filter-row {
      display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .filter-chip {
      height: 2rem; padding: 0 .75rem; border-radius: 1rem;
      border: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
      background: var(--gm3-sys-color-surface, #fff);
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: .8125rem; font-weight: 500;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      cursor: pointer; display: flex; align-items: center; gap: .25rem;
      transition: all .15s; white-space: nowrap;
    }
    .filter-chip.active {
      background: #e8f0fe;
      border-color: #1a73e8; color: #1a73e8;
    }
    .filter-chip:hover:not(.active) { background: var(--gm3-sys-color-surface-container, #f0f4f9); }
    .filter-chip .icon { font-family: 'Material Symbols Outlined'; font-size: 16px; }
    .todo-date-label {
      font-size: .6875rem; font-weight: 700; letter-spacing: .8px;
      color: var(--gm3-sys-color-on-surface-variant, #444746);
      text-transform: uppercase;
      padding: 1rem 0 .5rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .todo-date-label::after { content: ''; flex: 1; height: .0625rem; background: var(--gm3-sys-color-outline-variant, #c4c7c5); }

    /* ===== 詳細モーダル ===== */

      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 500;
      align-items: center; justify-content: center;
    }
    .detail-overlay.open { display: flex; }
    .detail-modal {
      background: var(--gm3-sys-color-surface, #fff);
      border-radius: .75rem;
      width: 90%; max-width: 35rem; max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      animation: modalIn .2s cubic-bezier(.4,0,.2,1);
    }
    @keyframes modalIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .detail-header {
      display: flex; align-items: flex-start; gap: .75rem;
      padding: 1.25rem 1.25rem .75rem; border-bottom: .0625rem solid var(--gm3-sys-color-outline-variant, #c4c7c5);
    }
    .detail-header-icon {
      width: 2.5rem; height: 2.5rem; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Material Symbols Outlined'; font-size: 20px;
    }
    .detail-header-icon.assignment { background: #e8f0fe; color: #1a73e8; }
    .detail-header-icon.announcement { background: #fce8e6; color: #d93025; }
    .detail-title-wrap { flex: 1; min-width: 0; }
    .detail-title {
      font-family: Google Sans,Roboto,Arial,sans-serif;
      font-size: 1.125rem; font-weight: 400; line-height: 1.3;
      color: var(--gm3-sys-color-on-surface, #1f1f1f);
    }
    .detail-subtitle { font-size: .75rem; color: var(--gm3-sys-color-on-surface-variant, #444746); margin-top: .25rem; }
    .detail-close-btn {
      width: 2.5rem; height: 2.5rem; border-radius: 50%; border: none; background: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--gm3-sys-color-on-surface-variant, #444746); flex-shrink: 0;
      font-family: 'Material Symbols Outlined'; font-size: 20px;

<script>
'use strict';

// ============================================================
//  設定
// ============================================================
const GAS_ENDPOINT  = 'https://script.google.com/macros/s/AKfycbzwe-hIThstFUbhUQlsy6WoNmTpShPnYmbdSI0vXYCAgzNYQOomGbVWJ0kHCbTmLkLw/exec';
const CLIENT_ID     = '511963964147-lmq62r9fsltr7ue8pasf5dni19cb4vpb.apps.googleusercontent.com';
const ORIGIN        = location.origin; // GitHub Pagesのorigin
const SCOPES        = [
  'https://www.googleapis.com/auth/classroom.courses.readonly',
  'https://www.googleapis.com/auth/classroom.coursework.me.readonly',
  'https://www.googleapis.com/auth/classroom.announcements.readonly',
  'https://www.googleapis.com/auth/classroom.courseworkmaterials.readonly',
  'email',
  'profile',
].join(' ');

// ============================================================
//  認証
// ============================================================
let _token     = null;
let _expiry    = 0;
let userEmail  = '';

function isTokenValid() {
  return _token && Date.now() < _expiry - 60000; // 1分前に期限切れ扱い
}

function startLogin() {
  const authUrl =
    'https://accounts.google.com/o/oauth2/v2/auth' +
    '?client_id=' + encodeURIComponent(CLIENT_ID) +
    '&redirect_uri=' + encodeURIComponent(ORIGIN + '/classroom/auth.html') +
    '&response_type=token' +
    '&scope=' + encodeURIComponent(SCOPES) +
    '&prompt=select_account';

  const popup = window.open(authUrl, 'gc_auth', 'width=500,height=650,left=200,top=100');
  if (!popup) {
    // ポップアップブロックされた場合はリダイレクト
    window.location.href = authUrl;
    return;
  }

  // ポップアップからのメッセージを待つ
  window.addEventListener('message', async function onMsg(e) {
    if (e.origin !== ORIGIN) return;
    if (!e.data || e.data.type !== 'GC_AUTH_SUCCESS') return;
    window.removeEventListener('message', onMsg);
    _token  = e.data.token;
    _expiry = Number(e.data.expiry);
    sessionStorage.setItem('gc_access_token', _token);
    sessionStorage.setItem('gc_token_expiry', String(_expiry));
    localStorage.setItem('gc_access_token', _token);
    localStorage.setItem('gc_token_expiry', String(_expiry));
    // emailをtokeninfoから取得してlocalStorageに保存
    try {
      const infoRes = await fetch(
        'https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=' + encodeURIComponent(_token)
      );
      const info = await infoRes.json();
      userEmail = info.email || '';
      if (userEmail) localStorage.setItem('gc_user_email', userEmail);
    } catch(_) {}
    initApp();
  }, false);
}

function tryRestoreToken() {
  // sessionStorage と localStorage の両方を試す（リロード耐性のため）
  let t = sessionStorage.getItem('gc_access_token') || localStorage.getItem('gc_access_token');
  let e = Number(sessionStorage.getItem('gc_token_expiry') || localStorage.getItem('gc_token_expiry') || '0');
  if (t && Date.now() < e - 60000) {
    _token  = t;
    _expiry = e;
    // emailも復元
    userEmail = localStorage.getItem('gc_user_email') || '';
    return true;
  }
  return false;
}

function confirmLogout() {
  if (!confirm('ログアウトしますか？')) return;
  _token = null; _expiry = 0; userEmail = '';
  sessionStorage.removeItem('gc_access_token');
  sessionStorage.removeItem('gc_token_expiry');
  localStorage.removeItem('gc_access_token');
  localStorage.removeItem('gc_token_expiry');

// ============================================================
//  GAS API 呼び出し（fetch + Bearer token）
// ============================================================
async function gasCall(action, extra) {
  if (!isTokenValid()) throw new Error('ログインが必要です');
  const res = await fetch(GAS_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // GASはContent-Type: application/jsonをCORSで弾く
    body: JSON.stringify({ action, token: _token, ...extra }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function getClassroomData() { return gasCall('getClassroomData'); }
function forceRefresh()      { return gasCall('forceRefresh'); }

// ============================================================
//  IndexedDB キャッシュ（永続・TTLなし）
// ============================================================
const IDB_NAME  = 'gc_cache';
const IDB_STORE = 'data';
let _idb = null;

function idbOpen() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror   = () => reject(req.error);
  });
}

async function lsSave(data) {
  try {
    const key = 'classroom_v3_' + userEmail;
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx  = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).put({ data, savedAt: Date.now() }, key);
      req.onsuccess = () => resolve();
      req.onerror   = () => reject(req.error);
    });
  } catch(_) {}
}

async function lsLoad() {
  try {
    const key = 'classroom_v3_' + userEmail;
    const db = await idbOpen();
    return new Promise(resolve => {
      const tx  = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.data : null);
      req.onerror   = () => resolve(null);
    });
  } catch(_) { return null; }
}

async function lsClear() {
  try {
    const key = 'classroom_v3_' + userEmail;
    const db = await idbOpen();
    return new Promise(resolve => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
    });
  } catch(_) {}
}

const COURSE_BG_COLORS = [
  'rgb(23,78,166)',   // cobalt blue
  'rgb(52,168,83)',   // sage green
  'rgb(234,67,53)',   // flamingo
  'rgb(251,188,5)',   // tangerine
  'rgb(103,58,183)',  // amethyst
  'rgb(0,121,107)',   // teal
  'rgb(33,150,243)',  // blueberry
  'rgb(96,125,139)',  // graphite
];

const THEME_IMAGES = [
  'https://gstatic.com/classroom/themes/img_graduation.jpg',
  'https://gstatic.com/classroom/themes/img_bookclub.jpg',
  'https://gstatic.com/classroom/themes/img_reachingout.jpg',
  'https://gstatic.com/classroom/themes/img_code.jpg',
  'https://gstatic.com/classroom/themes/Geometry.jpg',
  'https://gstatic.com/classroom/themes/img_breakfast.jpg',
  'https://gstatic.com/classroom/themes/img_learnlanguage.jpg',
  'https://gstatic.com/classroom/themes/Chemistry.jpg',
];

let courseThemeMap = {};

function hashStr(s) {
  let h=0; for(let i=0;i<s.length;i++) h=(Math.imul(31,h)+s.charCodeAt(i))|0; return h;
}
function courseColor(id) {
  return COURSE_BG_COLORS[Math.abs(hashStr(String(id||'0'))) % COURSE_BG_COLORS.length];
}
function courseThemeImg(id) {
  if (courseThemeMap[String(id)]) return courseThemeMap[String(id)];
  return THEME_IMAGES[Math.abs(hashStr(String(id||'0'))) % THEME_IMAGES.length];
}

// ============================================================
//  日付ユーティリティ
// ============================================================
const TODAY = (()=>{ const d=new Date(); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; })();
const DOW = ['日','月','火','水','木','金','土'];

function parseDt(s) {
  if (!s||s==='未定') return null;
  const p=String(s).split(/[\/\-]/);
  return p.length<3 ? null : new Date(+p[0],+p[1]-1,+p[2]);
}
function diffDays(s) {
  const d=parseDt(s); if(!d) return null;
  const t=parseDt(TODAY); return Math.round((d-t)/86400000);
}
function fmtDate(s) {
  if (!s||s==='未定') return '期限なし';
  const d=parseDt(s); if(!d) return s;
  const diff=diffDays(s);
  if(diff===0) return '今日';
  if(diff===1) return '明日';
  if(diff===-1) return '昨日';
  if(diff!==null&&diff>0&&diff<=7) return `${diff}日後 (${d.getMonth()+1}/${d.getDate()})`;
  return `${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`;
}
function fmtCreatedAt(s) {
  if (!s) return '';
  const d=parseDt(s); if(!d) return s;
  const diff=diffDays(s);
  if(diff===0) return '今日';
  if(diff===-1) return '昨日';
  const thisYear=new Date().getFullYear();
  if(d.getFullYear()===thisYear) return `${d.getMonth()+1}月${d.getDate()}日`;
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function fmtDateLong(s) {
  const d=parseDt(s); if(!d) return s;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`;
}
function urgCls(s) {
  const d=diffDays(s); if(d===null) return '';
  if(d<0) return 'urgent'; if(d<=2) return 'urgent'; if(d<=5) return 'soon'; return '';
}

function applyData(data) {
  cachedCourses     = data.courses      || [];
  cachedCourseWorks = data.courseWorks  || [];
  cachedAnns        = data.announcements || [];
  cachedMaterials   = data.materials    || [];
  cachedCourses.forEach(c => {
    if (c.themeImageUrl) courseThemeMap[String(c.id)] = c.themeImageUrl;
  });
}

function hasChanged(oldData, newData) {
  if (!oldData) return true;
  return (
    (oldData.courses      ||[]).length !== (newData.courses      ||[]).length ||
    (oldData.courseWorks  ||[]).length !== (newData.courseWorks  ||[]).length ||
    (oldData.announcements||[]).length !== (newData.announcements||[]).length ||
    (oldData.materials    ||[]).length !== (newData.materials    ||[]).length
  );
}

async function loadHome(force) {
  const el=document.getElementById('home-content');

  if (force) { await lsClear(); cachedCourses=[]; }

  if (cachedCourses.length) {
    renderHome(); renderDrawerCourses(); _bgRefresh(); return;
  }

  const idbData = await lsLoad();
  if (idbData) {
    applyData(idbData);
    renderHome(); renderDrawerCourses();
    _bgRefresh(idbData);
    return;
  }

  el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try {
    const data = await getClassroomData();
    if (!data || !data.success) throw new Error(data && data.error || '取得失敗');
    applyData(data);
    lsSave(data);
    renderHome(); renderDrawerCourses();
  } catch(e) {
    if (e.message === 'ログインが必要です') { showNeedLogin(); return; }
    el.innerHTML=`<div style="padding:1.5rem;"><div style="background:#fce8e6;border-left:4px solid #d93025;padding:.75rem 1rem;border-radius:.25rem;color:#c5221f;font-size:.875rem;">読み込みエラー: ${esc(e.message)}</div></div>`;

}

let _bgRunning = false;

  if (_bgRunning) return;
  _bgRunning = true;
  getClassroomData().then(data => {
    _bgRunning = false;
    if (!data || !data.success) return;
    if (hasChanged(prevData || { courses:cachedCourses, courseWorks:cachedCourseWorks, announcements:cachedAnns, materials:cachedMaterials }, data)) {
      applyData(data); lsSave(data);
      if (currentView==='home')           { renderHome(); renderDrawerCourses(); }
      else if (currentView==='stream')    { _renderStream(currentCourseId, document.getElementById('stream-content')); }
      else if (currentView==='classwork') { _renderClasswork(currentCourseId, document.getElementById('classwork-content')); }
      else if (currentView==='todo')      { renderTodo(); }
    } else {
      lsSave(data);
    }
  }).catch(() => { _bgRunning = false; });
}

        ${isTask&&dueLabel?`<span class="mat-icon">event</span>${esc(dueLabel)}`:''}
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;">
        ${isTask?`<button class="check-btn ${item.completed?'done':''}" onclick="toggleTask('${aid}',this)" title="${item.completed?'提出を取り消す':'提出済みにする'}">${item.completed?'<span style="font-family:\'Material Symbols Outlined\';font-size:18px;">check</span>':''}</button>`:''}
        ${item.link?`<a class="open-link" href="${esc(item.link)}" target="_blank" style="display:inline-flex;align-items:center;gap:.25rem;font-size:.875rem;font-weight:500;font-family:Google Sans,Roboto,Arial,sans-serif;color:#1a73e8;text-decoration:none;padding:.375rem .75rem;border-radius:.25rem;transition:background .15s;"><span style="font-family:'Material Symbols Outlined';font-size:16px;">open_in_new</span>開く</a>`:''}
      </div>
    </div>
  </div>`;
}

// ============================================================
//  CLASSWORK
// ============================================================
async function loadClasswork(params) {
  const cid=(params&&params.courseId)||currentCourseId;
  const el=document.getElementById('classwork-content');
  if (!cachedCourses.length) el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try { await ensureData(); renderDrawerCourses(); }
  catch(e) {
    if (e.message==='ログインが必要です') { showNeedLogin(); return; }
    el.innerHTML=`<div style="padding:1.5rem;color:#c5221f;">読み込みエラー: ${esc(e.message)}</div>`; return;
  }
  _renderClasswork(cid, el);
}

function _renderClasswork(cid, el) {
  const c=cachedCourses.find(x=>String(x.id)===String(cid))||{id:cid,name:'クラス'};
  const tasks=cachedCourseWorks.filter(t=>String(t.course_id)===String(cid))
                               .sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
  const color=courseColor(cid);
  const img=courseThemeImg(cid);

  let html=`
    <div class="course-banner" style="max-width:62rem;margin:0 auto;border-radius:0 0 .75rem .75rem;">
      <div class="course-banner-bg" style="background-image:url('${img}');background-color:${color};"></div>
      <div class="course-banner-overlay"></div>
      <div class="course-banner-text">
        <div class="course-banner-name">${esc(c.name)}</div>
        ${c.section?`<div class="course-banner-sub">${esc(c.section)}</div>`:''}
      </div>
    </div>
    <div style="max-width:62rem;margin:0 auto;">
      <div class="course-tabs" style="border-radius:0;border-left:none;border-right:none;border-top:none;">
        <button class="course-tab" onclick="openCourse('${esc(cid)}')">ストリーム</button>
        <button class="course-tab active">授業</button>
      </div>
    </div>
    <div class="classwork-container">`;

  if(!tasks.length){
    html+=`<div class="empty-state"><span class="icon">assignment</span><h3>課題はありません</h3></div></div>`;
    el.innerHTML=html; return;
  }

  const grps={};
  const ORDER=['今日まで','明日まで','今週中','それ以降','期限なし','期限切れ'];
  tasks.forEach(t=>{
    const diff=diffDays(t.deadline);
    let g;
    if(!t.deadline||t.deadline==='未定') g='期限なし';
    else if(diff<0)   g='期限切れ';
    else if(diff===0) g='今日まで';
    else if(diff===1) g='明日まで';
    else if(diff<=7)  g='今週中';
    else              g='それ以降';
    if(!grps[g]) grps[g]=[];
    grps[g].push(t);
  });

  ORDER.filter(g=>grps[g]).forEach(g=>{
    html+=`
    <div class="topic-section">
      <div class="topic-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.style.display=this.classList.contains('collapsed')?'none':'block'">
        <span class="topic-title">${g}</span>
        <span class="topic-chevron notranslate" style="font-family:'Material Symbols Outlined';font-size:24px;">expand_more</span>
      </div>
      <div class="work-list">`;
    grps[g].forEach(t=>{ html+=buildWorkItem(t); });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}

function buildWorkItem(item) {
  const done=item.completed;
  const dl=item.deadline||'';
  const urg=urgCls(dl);
  const dueLabel=dl&&dl!=='未定'?fmtDate(dl):'期限なし';
  const aid=esc(item.id||'');
  let chip='';
  if(urg==='urgent'&&diffDays(dl)<0) chip=`<span style="font-size:.6875rem;padding:.125rem .5rem;border-radius:.75rem;background:#fce8e6;color:#d93025;font-weight:600;">期限切れ</span>`;
  else if(urg==='urgent') chip=`<span style="font-size:.6875rem;padding:.125rem .5rem;border-radius:.75rem;background:#fce8e6;color:#d93025;font-weight:600;">急ぎ</span>`;
  else if(urg==='soon')   chip=`<span style="font-size:.6875rem;padding:.125rem .5rem;border-radius:.75rem;background:#fef7e0;color:#e37400;font-weight:600;">まもなく</span>`;

  return `
  <div class="work-item" id="wi-${aid}" onclick="openDetail(${JSON.stringify(JSON.stringify(item))})">
    <div class="work-item-icon ${done?'done-icon':'assignment'}">${done?'assignment_turned_in':'assignment'}</div>
    <div class="work-item-info">
      <div class="work-item-title ${done?'done':''}">${esc(item.title||'（タイトルなし）')}</div>
      <div class="work-item-meta">
        <span class="subject-pill" style="background:#e8f0fe;color:#1a73e8;">${esc(item.course_name||'')}</span>
        <div class="work-item-due ${urg}">
          <span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:14px;">event</span>
          ${esc(dueLabel)}
        </div>
        ${chip}
      </div>
    </div>
    <div class="work-item-right" onclick="event.stopPropagation()">
      <button class="check-btn ${done?'done':''}"
        onclick="toggleTask('${aid}',this)"
        title="${done?'完了済み（クリックで戻す）':'完了にする'}">
        ${done?'<span style="font-family:\'Material Symbols Outlined\';font-size:18px;">check</span>':'<span style="font-family:\'Material Symbols Outlined\';font-size:18px;color:transparent;">check</span>'}
      </button>
    </div>
  </div>`;
}

// ============================================================
//  TODO
// ============================================================
async function loadTodo(force) {
  const el=document.getElementById('todo-content');
  if (force) { await lsClear(); cachedCourses=[]; }
  if (!cachedCourseWorks.length) el.innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  try { await ensureData(); renderTodo(); }
  catch(e) {
    if (e.message==='ログインが必要です') { showNeedLogin(); return; }
    el.innerHTML=`<div style="padding:1.5rem;color:#c5221f;">${esc(e.message)}</div>`;
  }
}

function setTodoFilter(f) {
  todoFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active',c.dataset.filter===f));
  renderTodo();
}

function renderTodo() {
  const el=document.getElementById('todo-content');
  let tasks=[...cachedCourseWorks];
  if(todoFilter==='upcoming') tasks=tasks.filter(t=>!t.completed);
  if(todoFilter==='done')     tasks=tasks.filter(t=>t.completed);
  if(todoFilter==='overdue')  tasks=tasks.filter(t=>!t.completed&&diffDays(t.deadline)!==null&&diffDays(t.deadline)<0);
  tasks.sort((a,b)=>(a.deadline||'9999/99/99').localeCompare(b.deadline||'9999/99/99'));

  let html=`
    <div class="todo-page-title">To-do</div>
    <div class="filter-row">
      <button class="filter-chip ${todoFilter==='upcoming'?'active':''}" data-filter="upcoming" onclick="setTodoFilter('upcoming')"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:16px;">schedule</span> 近日</button>
      <button class="filter-chip ${todoFilter==='done'?'active':''}" data-filter="done" onclick="setTodoFilter('done')"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:16px;">check_circle</span> 完了済み</button>
      <button class="filter-chip ${todoFilter==='overdue'?'active':''}" data-filter="overdue" onclick="setTodoFilter('overdue')"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:16px;">warning</span> 期限切れ</button>
    </div>`;

  if(!tasks.length){
    html+=`<div class="empty-state"><span class="icon notranslate" style="font-family:'Material Symbols Outlined';font-size:64px;color:var(--gm3-sys-color-outline-variant,#c4c7c5);">check_circle_outline</span><h3>${todoFilter==='done'?'完了した課題はありません':todoFilter==='overdue'?'期限切れはありません！':'すべて完了しています！'}</h3></div>`;
  } else {
    const grps={},gOrder=[];
    tasks.forEach(t=>{
      const diff=diffDays(t.deadline);
      let g;
      if(!t.deadline||t.deadline==='未定') g='期限なし';
      else if(diff<0)   g='期限切れ';
      else if(diff===0) g='今日';
      else if(diff===1) g='明日';
      else              g=fmtDateLong(t.deadline);
      if(!grps[g]){grps[g]=[];gOrder.push(g);}
      grps[g].push(t);
    });
    gOrder.forEach(g=>{
      html+=`<div class="todo-date-label">${esc(g)}</div>
        <div style="background:var(--gm3-sys-color-surface,#fff);border-radius:.5rem;margin-bottom:.5rem;overflow:hidden;border:.0625rem solid var(--gm3-sys-color-outline-variant,#c4c7c5);">`;
      grps[g].forEach(t=>{ html+=buildWorkItem(t); });
      html+=`</div>`;
    });
  }
  el.innerHTML=html;
}

// ============================================================
//  課題完了トグル
// ============================================================
function toggleTask(taskId, btn) {
  const done=btn.classList.contains('done');
  const newVal=!done;

  document.querySelectorAll(`[onclick*="'${taskId}'"]`).forEach(b => {
    if(b.classList.contains('check-btn')) {
      if(newVal) {
        b.classList.add('done');
        b.innerHTML='<span style="font-family:\'Material Symbols Outlined\';font-size:18px;">check</span>';
        b.title='提出を取り消す';
      } else {
        b.classList.remove('done');
        b.innerHTML='';
        b.title='提出済みにする';
      }
    }
  });

  cachedCourseWorks=cachedCourseWorks.map(t=>t.id===taskId?{...t,completed:newVal}:t);
  snack(newVal?'✓ 提出済みにしました':'提出を取り消しました');
  if(currentView==='todo') renderTodo();

  gasCall('setTaskCompleted', { courseWorkId: taskId, completed: newVal }).catch(()=>{});
}

// ============================================================
//  詳細モーダル
// ============================================================
function openDetail(itemJson) {
  const item=typeof itemJson==='string'?JSON.parse(itemJson):itemJson;
  const isTask=item.type==='assignment';
  const isMaterial=item.type==='material';

  const icon=document.getElementById('detail-icon');
  icon.className='detail-header-icon '+(isTask?'assignment':isMaterial?'material':'announcement');
  icon.textContent=isTask?'assignment':isMaterial?'description':'campaign';

  document.getElementById('detail-title').textContent=item.title||'（タイトルなし）';
  document.getElementById('detail-subtitle').textContent=item.course_name||'';

  const dueRow=document.getElementById('detail-due-row');
  if(isTask&&item.deadline&&item.deadline!=='未定'){
    document.getElementById('detail-due').textContent=fmtDateLong(item.deadline)+' まで';
    dueRow.style.display='flex';
  } else { dueRow.style.display='none'; }

  document.getElementById('detail-subject').textContent=item.course_name||'';
  const descEl=document.getElementById('detail-desc');
  descEl.textContent=item.description||'';
  descEl.style.display=item.description?'block':'none';

  const openBtn=document.getElementById('detail-open-btn');
  openBtn.href=item.link||'#';
  openBtn.style.display=item.link?'inline-flex':'none';

  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(e) {
  if(e&&e.target!==document.getElementById('detail-overlay')) return;
  document.getElementById('detail-overlay').classList.remove('open');
}

// ============================================================
//  ポーリング（共有サマリー差分通知）
// ============================================================
const POLL_INTERVAL = 30 * 1000;
let _pollTimer    = null;
let _lastWrittenAt = null;
let _pendingData  = null;
let _pollActive   = false;

// 学校の時間帯（月〜金 7:30〜20:00）のみポーリング
function shouldPoll() {
  const now = new Date();
  const dow = now.getDay(); // 0=日, 6=土
  if (dow === 0 || dow === 6) return false;
  const h = now.getHours();
  const m = now.getMinutes();
  const t = h * 60 + m;
  return t >= 7*60+30 && t < 20*60;
}

function showUpdateBanner(msg) {
  const banner = document.getElementById('update-banner');
  document.getElementById('update-banner-text').textContent = msg;
  banner.classList.add('show');
}
function hideUpdateBanner() {
  document.getElementById('update-banner').classList.remove('show');
}

function applyUpdate() {
  hideUpdateBanner();
  if (!_pendingData) return;
  applyData(_pendingData); lsSave(_pendingData); _pendingData = null;
  if (currentView==='home')           { renderHome(); renderDrawerCourses(); }
  else if (currentView==='stream')    { _renderStream(currentCourseId, document.getElementById('stream-content')); }
  else if (currentView==='classwork') { _renderClasswork(currentCourseId, document.getElementById('classwork-content')); }
  else if (currentView==='todo')      { renderTodo(); }
  snack('更新しました');
}

async function pollOnce() {
  if (_pollActive || !shouldPoll()) return;
  _pollActive = true;
  try {
    const summary = await gasCall('getSharedSummary');
    if (!summary || !summary.success || summary.empty) return;

    const { cwCount, annCount, matCount, latestTime, writtenAt } = summary;
    if (!_lastWrittenAt) { _lastWrittenAt = writtenAt; return; }
    if (writtenAt === _lastWrittenAt) return;
    _lastWrittenAt = writtenAt;

    const myChanged =
      cwCount  !== cachedCourseWorks.length ||
      annCount !== cachedAnns.length        ||
      matCount !== cachedMaterials.length   ||
      latestTime > (cachedCourseWorks[0] && cachedCourseWorks[0].created_at || '');

    if (!myChanged) return;

    const data = await gasCall('forceRefresh');
    if (!data || !data.success) return;

    _pendingData = data;
    const newCw  = Math.max(0, (data.courseWorks   ||[]).length - cachedCourseWorks.length);
    const newAnn = Math.max(0, (data.announcements ||[]).length - cachedAnns.length);
    const newMat = Math.max(0, (data.materials     ||[]).length - cachedMaterials.length);
    let msg = '新しい投稿があります';
    const parts = [];
    if (newCw  > 0) parts.push(`課題${newCw}件`);
    if (newAnn > 0) parts.push(`お知らせ${newAnn}件`);
    if (newMat > 0) parts.push(`資料${newMat}件`);
    if (parts.length) msg = parts.join('・') + 'の新着';
    showUpdateBanner(msg + ' — タップして更新');
  } catch(_) {}
  finally { _pollActive = false; }
}

function startPolling() {
  if (_pollTimer) return;
  gasCall('getSharedSummary').then(s => {
    if (s && s.success && !s.empty) _lastWrittenAt = s.writtenAt;
  }).catch(()=>{});
  _pollTimer = setInterval(pollOnce, POLL_INTERVAL);
}

function stopPolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopPolling(); }
  else { startPolling(); pollOnce(); }
});

// ============================================================
//  Service Worker 登録
// ============================================================
async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('./sw.js');
  } catch(_) {}
}

// ============================================================
//  アプリ初期化
// ============================================================
function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // アバターの頭文字を設定
  const initial = (userEmail || 'U')[0].toUpperCase();
  document.getElementById('user-avatar').textContent = initial;

  try {
    const p=new URLSearchParams(window.location.search);
    const tab=p.get('tab');
    if(['home','todo','stream','classwork'].includes(tab)) showView(tab);
    else showView('home');
  } catch(_){ showView('home'); }

  setTimeout(startPolling, 5000);
  registerSW();
}

// ============================================================
//  起動時: トークン復元 or ログイン画面
// ============================================================
(async function boot() {
  if (tryRestoreToken()) {
    // emailはlocalStorageから即復元済み（tryRestoreToken内）
    // emailが空の場合のみtokeninfoで取得（初回ログイン後のリロード対策）
    if (!userEmail) {
      try {
        const infoRes = await fetch(
          'https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=' + encodeURIComponent(_token)
        );
        const info = await infoRes.json();
        userEmail = info.email || '';
        if (userEmail) localStorage.setItem('gc_user_email', userEmail);
      } catch(_) {}
    }
    initApp();
  }
  // それ以外はログイン画面のまま待機
})();
</script>
